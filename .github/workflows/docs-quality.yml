name: Documentation quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate documentation structure and continuity
        run: python scripts/validate_docs.py
      - name: Install MkDocs
        run: pip install -r requirements-docs.txt
      - name: Build Markdown portfolio site
        run: mkdocs build --strict
      - name: Lint Markdown entry points
        uses: DavidAnson/markdownlint-cli2-action@v25.0.0
        with:
          config: .markdownlint-cli2.jsonc
          globs: |
            AGENTS.md
            PROMPT_VIVO/AGENTS.md
            PROMPT_VIVO/README.md
            PROMPT_VIVO/ARCHITECTURE_GOVERNANCE.md
            PROMPT_VIVO/BOOTSTRAP.md
            PROMPT_VIVO/CURRENT_WORK.md
            PROMPT_VIVO/runs/*/README.md
            PROMPT_VIVO/runs/*/RESUME_PACKET.md
            operations/README.md
            scripts/README.md
            .github/README.md
            .github/workflows/README.md
            README.md
            docs/BRIEF.md
            PROMPT_VIVO/README.md
            web/README.md
            web/AI_PROMPT_SCRIPTS.md
            operations/FIRST_SALE/README.md
            portfolio_site/README.md
            portfolio_site/docs/*.md
            PROMPT_VIVO/PHASES/README.md
